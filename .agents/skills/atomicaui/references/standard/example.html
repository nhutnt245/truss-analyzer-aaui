    <script>
      // Table: the picked row takes the selected row's class list and attributes, the others the first row's.
      const rows = [...document.querySelectorAll('[data-aui-selection-target="row"] tbody tr')];
      const [plainClasses, selectedClasses] = rows.map((row) => row.className);
      for (const row of rows) {
        row.addEventListener('click', () => {
          for (const other of rows) {
            const on = other === row;
            other.className = on ? selectedClasses : plainClasses;
            other.toggleAttribute('data-selected', on);
            other.setAttribute('aria-selected', String(on));
          }
        });
      }
    </script>
